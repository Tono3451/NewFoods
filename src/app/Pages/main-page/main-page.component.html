<body>
<app-header></app-header>

<main>
  <div class="button-container">
    <app-buttom buttonText="Recientes" (click)="changeFilter('dateTime')" buttonAction="submit"></app-buttom>
    <app-buttom buttonText="Populares" (click)="changeFilter('likes')" buttonAction="submit"></app-buttom>
    <app-buttom buttonText="Más guardadas" (click)="changeFilter('saved')" buttonAction="submit"></app-buttom>
  </div>

  <div class="image-container">
    <div *ngFor="let receta of recipes">
      <app-image-title-text-horizontal
        [recipe]="receta"
      ></app-image-title-text-horizontal>
    </div>
  </div>
</main>

<app-footer></app-footer>
</body>
