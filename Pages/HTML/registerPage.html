<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Register page">
    <meta name="keywords" content="HTML5, CSS3, JavaScript">
    <title>Registro</title>
    <script src="../../loadTemplate.js"></script>
    <link rel="stylesheet" href="../../Templates/CSS/TextInput.css">
    <link rel="stylesheet" href="../../Templates/CSS/button.css">
    <link rel="stylesheet" href="../../Templates/CSS/footer.css">
    <link rel="stylesheet" href="../CSS/registerPage.css">
</head>
<body>
<div id="wrapper">
    <div class="register_container">
        <h2 id="register-title">Crear una cuenta</h2>
        <form id="register-form">
            <div class="input-group">
                <label for="nombre">Nombre de usuario:</label>
                <input type="text" id="nombre" name="nombre" class="text-input" placeholder="Ej: Juan Pérez" required>
            </div>

            <div class="input-group">
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" class="text-input" placeholder="correo@gmail.com" required>
            </div>

            <div class="input-group">
                <label for="contraseña">Contraseña:</label>
                <input type="password" id="contraseña" name="contraseña" class="text-input" placeholder="Mínimo 8 caracteres" minlength="8" required>
            </div>

            <div class="input-group">
                <label for="confirmar">Confirmar contraseña:</label>
                <input type="password" id="confirmar" name="confirmar" class="text-input" placeholder="Repite la contraseña" minlength="8" required>
            </div>

            <button type="submit" class="button">Crear cuenta</button>
        </form>
    </div>

    <footer id="main_footer"></footer>
</div>

<script>
    document.addEventListener('DOMContentLoaded', init);


    function init() {

        loadTemplate('../../Templates/HTML/footer.html', 'main_footer');

    }
</script>

<script>
    document.getElementById("register-form").addEventListener("submit", async function(event) {
        event.preventDefault(); // Evita el envío automático

        const nombre = document.getElementById("nombre").value;
        const correo = document.getElementById("correo").value;
        const contraseña = document.getElementById("contraseña").value;
        const confirmar = document.getElementById("confirmar").value;

        if (contraseña !== confirmar) {
            alert("Las contraseñas no coinciden.");
            return;
        }

        try {
            // Verificar si el usuario ya existe en JSON Server
            let response = await fetch("http://localhost:3000/usuarios");
            let usuarios = await response.json();

            if (usuarios.some(user => user.correo === correo)) {
                alert("Este correo ya está registrado.");
                return;
            }

            // Guardar usuario en JSON Server
            let nuevoUsuario = { nombre, correo, contraseña };

            let saveResponse = await fetch("http://localhost:3000/usuarios", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(nuevoUsuario)
            });

            if (!saveResponse.ok) {
                alert("Error al registrar usuario.");
            }

            let usuarioLocal = { nombre, correo };
            let usuariosLocal = JSON.parse(localStorage.getItem("usuarios")) || [];
            usuariosLocal.push(usuarioLocal);
            localStorage.setItem("usuarios", JSON.stringify(usuariosLocal));

            alert("Registro exitoso. Ahora puedes iniciar sesión.");
            window.location.href = "loginPage.html";

        } catch (error) {
            console.error("Error en el registro:", error);
            alert("No se pudo conectar con el servidor.");
        }
    });
</script>

</body>
</html>
