<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Search page">
    <meta name="keywords" content="HTML5, CSS3, JavaScript">
    <title>Search_page</title>
    <script src="../../Templates/Script/xlu-include-file.js"></script>
    <link rel="stylesheet" href="../../Templates/CSS/header.css">
    <link rel="stylesheet" href="../../Templates/CSS/TextInput.css">
    <link rel="stylesheet" href="../../Templates/CSS/dropdownInput.css">
    <link rel="stylesheet" href="../../Templates/CSS/button.css">
    <link rel="stylesheet" href="../../Templates/CSS/footer.css">
    <link rel="stylesheet" href="../CSS/searchPage.css">

</head>
<body>
<div id="wrapper">
    <header id="main_header" xlu-include-file="/Templates/HTML/header.html"></header>

    <div class="search_container">
        <form id="searchForm">
        <div class="input-group">
            <h2 id="text1">Lorem ipsum</h2>
            <div class="input-container" id="nombre" xlu-include-file="/Templates/HTML/TextInput.html"></div>
        </div>

        <div class="input-group">
            <h2 id="text2">Lorem ipsum</h2>
            <div class="input-container" id="ingredientes" xlu-include-file="/Templates/HTML/TextInput.html"></div>
        </div>

        <div class="input-group">
            <h2 id="text3">Lorem ipsum</h2>
            <div class="input-container" id="dificultad" xlu-include-file="/Templates/HTML/dropdownInput.html"></div>
        </div>

        <div class="input-group">
            <h2 id="text4">Lorem ipsum</h2>
            <div class="input-container" id="duración" xlu-include-file="/Templates/HTML/slider.html"></div>
        </div>

        <div class="input-group">
            <div class="input-container" id="buscar" xlu-include-file="/Templates/HTML/button.html"></div>
        </div>


        </form>

    </div>

    <footer id="main_footer" xlu-include-file="/Templates/HTML/footer.html"></footer>

</div>

<script>
    setTimeout(function () {
        document.getElementById('text1').textContent = "Nombre receta";
        document.getElementById('text2').textContent = "Ingredientes";
        document.getElementById('text3').textContent = "Dificultad";
        document.getElementById('text4').textContent = "Duración";
        document.getElementById('buscar').querySelector('.button').textContent = "Buscar";
        document.getElementById('nombre').querySelector('.text-input').placeholder = "Tortilla de patatas";
        document.getElementById('ingredientes').querySelector('.text-input').placeholder = "Cebolla";
    }, 200);
</script>

<script>
    setTimeout(function () {
        // Selecciona el botón dentro del contenedor "buscar"
        const searchButton = document.querySelector("#buscar .button");

        if (searchButton) {
            searchButton.addEventListener("click", function(event) {
        event.preventDefault(); // Evitamos el envío normal del formulario

        // Obtener valores de los campos
        const nombre = document.getElementById("nombre").querySelector("input").value;
        const ingredientes = document.getElementById("ingredientes").querySelector("input").value;
        const dificultad = document.getElementById("dificultad").querySelector("input").value;
        const duración = document.getElementById("duración").querySelector("input").value;


        // Crear parámetros de URL
        const params = new URLSearchParams();
        if (nombre) params.append("nombre", nombre);
        if (ingredientes) params.append("ingredientes", ingredientes);
        if (dificultad) params.append("dificultad", dificultad);
        if (duración) params.append("duración", duración);
        console.log(params.toString());

        // Redirigir a resultsPage.html con los parámetros de búsqueda
        window.location.href = `resultsPage.html?${params.toString()}`;
            });
        }
    }, 200);
</script>

<script>
    xLuIncludeFile();
</script>
</body>
</html>
