<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Create Recipe page">
  <meta name="keywords" content="HTML5, CSS3, JavaScript">
  <title>Create recipe page</title>
  <script src="../../loadTemplate.js"></script>
  <link rel="stylesheet" href="../CSS/CreateRecipePage.css">
  <link rel="stylesheet" href="../../Templates/CSS/GetImage.css">
</head>
<body>
  <header id="main_header"></header>

  <div id="wrapper">
    <!-- Titulo de crear una receta -->
    <h1>Crear receta</h1>

    <div class="section-group">
      <h2>Título</h2>
      <input type="text" id="recipe-title" placeholder="Nombre de la receta">
    </div>

    <div class="section-group">
      <h2>Subtítulo</h2>
      <input type="text" id="recipe-subtitle" placeholder="Subtitulo de la receta">
    </div>

    <!-- Insertar imagen -->
    <div class="section-group">
      <h2>Subir imagen</h2>
      <div class="image-input-container" id="get_image"></div>
    </div>

    <!-- Descricion de la receta -->
    <div class="section-group">
      <h2>Breve descripción</h2>
      <div class="description-text" id="description-text1"></div>
    </div>

    <!-- Dificultad -->
    <div class="section-group">
      <h2>Dificultad</h2>
      <div class="difficulty-input" id="difficulty-input"></div>
    </div>

    <!-- Duración -->
    <div class="section-group">
      <h2>Duración (minutos)</h2>
      <div class="duration-input" id="duration-input"></div>
    </div>

    <!-- Ingredientes -->
    <div class="section-group">
      <h2>Ingredientes</h2>
      <textarea class="description-input" id="add-text-block"  placeholder="Lista de ingredientes..."></textarea>
    </div>

    <!-- Información nutricional -->
    <div class="section-group">
      <h2>Información nutricional</h2>
      <!-- Carbohidratos -->
      <div class="input-nutricional-information">
        <h3>Carbohidratos:</h3>
        <div class="num-input" id="num_input1"></div>
      </div>
      <!-- Proteinas -->
      <div class="input-nutricional-information">
        <h3>Proteinas:</h3>
        <div class="num-input" id="num_input2"></div>
      </div>
      <!-- Grasas -->
      <div class="input-nutricional-information">
        <h3>Grasas:</h3>
        <div class="num-input" id="num_input3"></div>
      </div>
      <!-- Fibras -->
      <div class="input-nutricional-information">
        <h3>Fibras:</h3>
        <div class="num-input" id="num_input4"></div>
      </div>
      <!-- Calorias -->
      <div class="input-nutricional-information">
        <h3>Calorias:</h3>
        <div class="num-input" id="num_input5"></div>
      </div>
    </div>

    <!-- Descricion de la receta -->
    <div class="section-group">
      <h2>Pasos a seguir</h2>
      <textarea class="description-input" id="description-text2" placeholder="Pasos de la receta..."></textarea>
    </div>

  </div>
  <div class="button-finish-form" id="button1"></div>


  <footer id="main_footer"></footer>


</body>


<script>
  document.addEventListener('DOMContentLoaded', init);


  function init() {


    loadTemplate('../../Templates/HTML/header.html', 'main_header');

    loadTemplate('../../Templates/HTML/GetImage.html', 'get_image');

    loadTemplate('../../Templates/HTML/TextInput2.html', 'description-text1');

    loadTemplate('../../Templates/HTML/dropdownInput.html', 'difficulty-input');
    loadTemplate('../../Templates/HTML/NumberInput.html', 'duration-input');
    loadTemplate('../../Templates/HTML/NumberInput.html', 'num_input1');
    loadTemplate('../../Templates/HTML/NumberInput.html', 'num_input2');
    loadTemplate('../../Templates/HTML/NumberInput.html', 'num_input3');
    loadTemplate('../../Templates/HTML/NumberInput.html', 'num_input4');
    loadTemplate('../../Templates/HTML/NumberInput.html', 'num_input5');

    loadTemplate('../../Templates/HTML/button.html', 'button1');

    loadTemplate('../../Templates/HTML/footer.html', 'main_footer');

  }

</script>

<script>
  setTimeout(function () {
    document.getElementById('button1').querySelector('.button').textContent = "Crear";
    setupRecipeCreation();
  }, 100);

  function setupRecipeCreation() {
    document.querySelector("#button1 .button").addEventListener("click", async function () {
      const title = document.querySelector("#recipe-title")?.value.trim() || "";
      const subtitle = document.querySelector("#recipe-subtitle")?.value.trim() || "";
      const description = document.querySelector("#description-text1 input, #description-text1 textarea")?.value.trim() || "";
      const difficulty = document.querySelector("#difficulty-input input")?.value.trim() || "";
      const duration = document.querySelector("#duration-input input")?.value || "";
      const ingredients = document.querySelector("#add-text-block")?.value.split("\n").map(ing => ing.trim()).filter(ing => ing) || [];
      const steps = document.querySelector("#description-text2")?.value.split("\n").map(step => step.trim()).filter(step => step) || [];
      const likes = 0;
      const saved = 0;

      // Capturar valores nutricionales
      const nutrition = {
        carbohydrates: document.querySelector("#num_input1 input")?.value  + "g",
        proteins: document.querySelector("#num_input2 input")?.value  + "g",
        fats: document.querySelector("#num_input3 input")?.value  + "g",
        fiber: document.querySelector("#num_input4 input")?.value  + "g",
        calories: document.querySelector("#num_input5 input")?.value  + "kcal"
      };

      // Obtener ID nuevo como string
      const newId = await getNextRecipeId();

      // Procesar imagen
      const imageInput = document.querySelector("#get_image input[type='file']");
      let imageBase64 = "";

      if (imageInput?.files.length > 0) {
        imageBase64 = await processImage(imageInput.files[0]);
      }

      await sendRecipe(newId, title, subtitle, description, difficulty, duration, ingredients, steps, nutrition, likes, saved, imageBase64);
    });
  }

  async function getNextRecipeId() {
    try {
      const response = await fetch('http://localhost:3000/recipes');
      const recipes = await response.json();

      if (recipes.length === 0) {
        return "1"; // Si no hay recetas, el primer ID es "1"
      }

      // Obtener el ID numérico más alto y sumarle 1
      const maxId = Math.max(...recipes.map(recipe => parseInt(recipe.id, 10) || 0));
      return (maxId + 1).toString(); // Convertir a string
    } catch (error) {
      console.error("Error obteniendo ID:", error);
      return "1"; // En caso de error, usar "1" como fallback
    }
  }

  async function processImage(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => {
        const img = new Image();
        img.src = reader.result;
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");

          const maxWidth = 600;
          const maxHeight = 600;
          let width = img.width;
          let height = img.height;

          if (width > maxWidth || height > maxHeight) {
            const aspectRatio = width / height;
            if (width > height) {
              width = maxWidth;
              height = maxWidth / aspectRatio;
            } else {
              height = maxHeight;
              width = maxHeight * aspectRatio;
            }
          }

          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          const compressedBase64 = canvas.toDataURL("image/jpeg", 0.7);
          resolve(compressedBase64);
        };
      };
    });
  }

  async function sendRecipe(id, title, subtitle, description, difficulty, duration, ingredients, steps, nutrition, likes, saved, image) {
    const usuarioGuardado = localStorage.getItem("usuarioActual");
    const usuarioActual = usuarioGuardado ? JSON.parse(usuarioGuardado) : null;

    if (!usuarioActual) {
      alert("No hay usuario logueado");
      return;
    }

    const recipe = {id, title, subtitle, description, difficulty, duration, ingredients, steps, nutrition, likes, saved, image, userId: usuarioActual.id};

    try {
      const response = await fetch('http://localhost:3000/recipes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(recipe)
      });

      if (response.ok) {
        alert("Receta creada con éxito!");
        location.reload();
      } else {
        alert("Error al crear la receta.");
      }
    } catch (error) {
      console.error("Error:", error);
    }
  }
</script>

<script src="../../header.js"></script>

</html>
