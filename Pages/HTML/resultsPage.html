
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Results page">
  <meta name="keywords" content="HTML5, CSS3, JavaScript">

  <title>Results page</title>

  <script src="../../loadTemplate.js"></script>
  <link rel="stylesheet" href="../../Templates/CSS/header.css">
  <link rel="stylesheet" href="../../Templates/CSS/footer.css">
  <link rel="stylesheet" href="../../Templates/CSS/ImageTitleTextHorizontal.css">
  <link rel="stylesheet" href="../CSS/resultsPage.css">
</head>
<body>
<div id="wrapper">
  <header id="main_header"></header>
  <main>
  <h2>Resultados</h2>

  <div class="image-container">
    <div id="image-text"></div>
  </div>
  </main>

<footer id="main_footer"></footer>
</div>

<script>
  document.addEventListener('DOMContentLoaded', init);

  function init() {

    loadTemplate('../../Templates/HTML/header.html', 'main_header');
    loadTemplate('../../Templates/HTML/ImageTitleTextHorizontal.html', 'image-text', addRecipes);
    loadTemplate('../../Templates/HTML/footer.html', 'main_footer');

  }

  function addRecipes() {
    // Obtener los parámetros de la URL
    const params = new URLSearchParams(window.location.search);
    const searchName = params.get("nombre")?.toLowerCase() || "";
    const searchIngredients = params.get("ingredientes")?.toLowerCase().split(",") || [];
    const searchDifficulty = params.get("dificultad")?.toLowerCase() || "";
    const searchDuration = parseInt(params.get("duración")) || Infinity; // Si no hay duración, no filtrar

    fetch('/db.json')
            .then(response => response.json())
            .then(data => {
              const container = document.querySelector('.image-container');
              container.innerHTML = '';

              data.recipes
                      .filter(recipe => {
                        // Convertir valores a minúsculas para comparación insensible a mayúsculas
                        const recipeTitle = recipe.title.toLowerCase();
                        const recipeDifficulty = recipe.difficulty.toLowerCase();
                        const recipeDuration = parseInt(recipe.duration); // Convertir a número

                        // Normalizar los ingredientes quitando cantidades, caracteres extra y reduciendo a singular
                        const normalizeIngredient = ing => {
                          return ing
                                  .replace(/[\d½¼¾/]+/g, "") // Eliminar números y fracciones
                                  .replace(/g|kg|ml|l|tbsp|tsp|cda|cdta|pizca/g, "") // Eliminar unidades de medida comunes
                                  .trim()
                                  .replace(/s$/, ""); // Convertir plurales simples a singular (tomates → tomate)
                        };

                        const recipeIngredients = recipe.ingredients.map(ing => normalizeIngredient(ing));

                        // Filtro de nombre: debe contener la palabra clave en el título
                        const nameMatch = searchName ? recipeTitle.includes(searchName) : true;

                        // Filtro de ingredientes: debe tener al menos uno de los ingredientes buscados
                        const ingredientsMatch = searchIngredients.length > 0
                                ? searchIngredients.some(ing => recipeIngredients.includes(ing))
                                : true;

                        // Filtro de dificultad: debe coincidir exactamente
                        const difficultyMatch = searchDifficulty ? recipeDifficulty === searchDifficulty : true;

                        // Filtro de duración: la receta debe durar igual o menos del tiempo indicado
                        const durationMatch = recipeDuration <= searchDuration;

                        // La receta es válida si pasa todos los filtros
                        return nameMatch && ingredientsMatch && difficultyMatch && durationMatch;
                      })
                      .forEach(recipe => {
                        fetch('/NewFoods/Templates/HTML/ImageTitleTextHorizontal.html')
                          .then(response => response.text())
                          .then(template => {
                            const tempDiv = document.createElement('div');
                            tempDiv.innerHTML = template.trim();

                            document.querySelectorAll(".icon-save, .icon-like").forEach(button => {
                              button.addEventListener("click", event => {
                                event.preventDefault(); // Evita que el enlace se active
                                event.stopPropagation(); // Detiene la propagación del evento

                              });
                            });

                            const cardLink = tempDiv.querySelector('.card-link');

                            cardLink.href = `/NewFoods/Pages/HTML/recipePage.html?id=${recipe.id}`;
                            cardLink.querySelector('img').src = recipe.image;
                            cardLink.querySelector('img').alt = recipe.title;
                            cardLink.querySelector('h3').textContent = recipe.title;
                            cardLink.querySelector('.subtitle').textContent = recipe.subtitle;
                            cardLink.querySelector('.text').textContent = recipe.description;
                            cardLink.querySelector('.difficulty').textContent = recipe.difficulty;
                            cardLink.querySelector('.duration').textContent = recipe.duration;

                            // Actualizar valores de likes y saved
                            const likeButton = tempDiv.querySelector('.icon-like');
                            const saveButton = tempDiv.querySelector('.icon-save');

                            likeButton.querySelector('.like-count').textContent = recipe.likes;
                            saveButton.querySelector('.save-count').textContent = recipe.saved;

                            // Eventos para actualizar JSON Server
                            likeButton.addEventListener("click", () => updateRecipeStat(recipe.id, "likes", likeButton.querySelector('.like-count')));
                            saveButton.addEventListener("click", () => updateRecipeStat(recipe.id, "saved", saveButton.querySelector('.save-count')));

                            container.appendChild(cardLink);
                          });
              });
            })
            .catch(error => console.error('Error cargando recetas:', error));

    function updateRecipeStat(recipeId, field, countElement) {
      fetch(`http://localhost:3000/recipes/${recipeId}`)
              .then(response => response.json())
              .then(recipe => {
                const updatedValue = recipe[field] + 1;

                return fetch(`http://localhost:3000/recipes/${recipeId}`, {
                  method: "PATCH",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ [field]: updatedValue })
                });
              })
              .then(response => response.json())
              .then(updatedRecipe => {
                countElement.textContent = updatedRecipe[field];
              })
              .catch(error => console.error("Error actualizando la receta:", error));
    }
  }


</script>


</body>
</html>
