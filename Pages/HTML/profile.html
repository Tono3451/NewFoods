<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile Page</title>
  <link rel="stylesheet" href="../../Templates/CSS/header.css">
  <link rel="stylesheet" href="../../Templates/CSS/footer.css">
  <link rel="stylesheet" href="../../Templates/CSS/avatar.css">
  <link rel="stylesheet" href="../../Templates/CSS/ImageTemplate.css">
  <link rel="stylesheet" href="../CSS/profile.css">
  <script src="../../loadTemplate.js"></script>
</head>
<body>

<header id="main_header"></header>

<section id="avatar-container">
  <div id="avatar"></div>
  <div id="username">
    <p id="usernameParagraph">Username</p>
  </div>

</section><section class="gallery">
  <div class="labels">
    <a href="profile.html">
      <button class="button-label">Recetas guardadas</button>
    </a>
    <a href="profile.html">
      <button class="button-label">Recetas subidas</button>
    </a>
    <a href="profile2.html">
      <button class="button-label">Planning semanal</button>
    </a>
  </div>
</section>
<section class="grid">
  <div class="image" id="image1"></div>
  <div class="image" id="image2"></div>
  <div class="image" id="image3"></div>
  <div class="image" id="image4"></div>
  <div class="image" id="image5"></div>
  <div class="image" id="image6"></div>
</section>

<footer id="main_footer"></footer>

<script>
  document.addEventListener('DOMContentLoaded', init);

  function init() {


    loadTemplate('../../Templates/HTML/header.html', 'main_header');

    loadTemplate('../../Templates/HTML/avatar.html', 'avatar');

    loadTemplate('../../Templates/HTML/ImageTemplate.html', 'image1');
    loadTemplate('../../Templates/HTML/ImageTemplate.html', 'image2');
    loadTemplate('../../Templates/HTML/ImageTemplate.html', 'image3');
    loadTemplate('../../Templates/HTML/ImageTemplate.html', 'image4');
    loadTemplate('../../Templates/HTML/ImageTemplate.html', 'image5');
    loadTemplate('../../Templates/HTML/ImageTemplate.html', 'image6');

    loadTemplate('../../Templates/HTML/footer.html', 'main_footer');


  }
</script>

<script>
    //Redirigir en caso de que no haya un usuario logueado
    const usuarioGuardado = localStorage.getItem("usuarioActual");

    const usuarioActual = usuarioGuardado ? JSON.parse(usuarioGuardado) : null;

    document.addEventListener('DOMContentLoaded', function() {
        const usernameParagraph = document.querySelector('#username p');
        if (usernameParagraph) {
            usernameParagraph.textContent = usuarioActual.nombre; // Cambia 'NuevoNombre' por el texto que desees
        }
    });
</script>

</body>
</html>
