<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile Page</title>
  <link rel="stylesheet" href="../../Templates/CSS/header.css">
  <link rel="stylesheet" href="../../Templates/CSS/footer.css">
  <link rel="stylesheet" href="../../Templates/CSS/avatar.css">
  <link rel="stylesheet" href="../../Templates/CSS/ImageTemplate.css">
  <link rel="stylesheet" href="/Templates/CSS/ImageTitleTextHorizontal.css">
  <link rel="stylesheet" href="../CSS/profile.css">
  <script src="../../loadTemplate.js"></script>
</head>
<body>

<header id="main_header"></header>

<section id="avatar-container">
  <div id="avatar"></div>
  <div id="username">
    <p id="usernameParagraph">Username</p>
  </div>
</section>

<section class="gallery">
  <div class="labels">
    <button class="button-label" id="savedRecipesBtn">Recetas guardadas</button>
    <button class="button-label" id="uploadedRecipesBtn">Recetas subidas</button>
    <a href="profile2.html">
      <button class="button-label">Planning semanal</button>
    </a>
  </div>
</section>

<section id="recipesGrid"></section>


<footer id="main_footer"></footer>

<script>
  document.addEventListener('DOMContentLoaded', init);

  function init() {


    loadTemplate('../../Templates/HTML/header.html', 'main_header');

    loadTemplate('../../Templates/HTML/avatar.html', 'avatar');

    loadTemplate('../../Templates/HTML/footer.html', 'main_footer');


  }
</script>

<script>
    //Redirigir en caso de que no haya un usuario logueado
    const usuarioGuardado = localStorage.getItem("usuarioActual");

    const usuarioActual = usuarioGuardado ? JSON.parse(usuarioGuardado) : null;

    document.addEventListener('DOMContentLoaded', function() {
        const usernameParagraph = document.querySelector('#username p');
        if (usernameParagraph) {
            usernameParagraph.textContent = usuarioActual.nombre;
        }
    });
</script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const usuarioGuardado = localStorage.getItem("usuarioActual");
      const usuarioActual = usuarioGuardado ? JSON.parse(usuarioGuardado) : null;

      if (!usuarioActual) {
        window.location.href = "../../Pages/HTML/loginPage.html";
        return;
      }

      document.getElementById('savedRecipesBtn').addEventListener('click', () => loadUserRecipes("saved"));
      document.getElementById('uploadedRecipesBtn').addEventListener('click', () => loadUserRecipes("uploaded"));

      // Cargar recetas subidas por defecto
      loadUserRecipes("saved");
    });

    function loadUserRecipes(type) {
      const usuarioGuardado = localStorage.getItem("usuarioActual");
      const usuarioActual = usuarioGuardado ? JSON.parse(usuarioGuardado) : null;

      if (!usuarioActual) return;

      if (type === "saved") {
        fetch(`http://localhost:3000/usuarios/${usuarioActual.id}`)
                .then(response => response.json())
                .then(user => {
                  if (!user.savedRecipes || user.savedRecipes.length === 0) {
                    document.getElementById("recipesGrid").innerHTML = "<p>No tienes recetas guardadas.</p>";
                    return;
                  }

                  fetch('http://localhost:3000/recipes')
                          .then(response => response.json())
                          .then(recipes => {
                            const savedRecipes = recipes.filter(recipe => user.savedRecipes.includes(recipe.id));
                            displayRecipes(savedRecipes);
                          })
                          .catch(error => console.error("Error obteniendo recetas:", error));
                })
                .catch(error => console.error("Error obteniendo usuario:", error));
      } else {
        fetch('http://localhost:3000/recipes')
                .then(response => response.json())
                .then(recipes => {
                  const userRecipes = recipes.filter(recipe => recipe.userId === usuarioActual.id);
                  displayRecipes(userRecipes);
                })
                .catch(error => console.error("Error cargando recetas:", error));
      }
    }

    function displayRecipes(recipes) {
      const container = document.getElementById("recipesGrid");
      container.innerHTML = "";

      if (recipes.length === 0) {
        container.innerHTML = "<p>No hay recetas disponibles.</p>";
        return;
      }

      recipes.forEach(recipe => {
        const recipeCard = document.createElement("a");
        recipeCard.href = `/NewFoods/Pages/HTML/recipePage.html?id=${recipe.id}`;
        recipeCard.classList.add("card-link");

        recipeCard.innerHTML = `
        <div class="card">
            <div class="image-container">
                <img src="${recipe.image}" alt="${recipe.title}">
            </div>
            <div class="content">
                <h3>${recipe.title}</h3>
                <p class="subtitle">${recipe.subtitle}</p>
                <p class="text">${recipe.description}</p>
                <p class="info">
                    <strong>Dificultad:</strong> <span class="difficulty">${recipe.difficulty}</span> |
                    <strong>Tiempo:</strong> <span class="duration">${recipe.duration}</span><span> min</span>
                </p>
                <div class="icons">
                    <button class="icon-save">🔖 <span class="save-count">${recipe.saved || 0}</span></button>
                    <button class="icon-like">❤️ <span class="like-count">${recipe.likes || 0}</span></button>
                </div>
            </div>
        </div>
      `;

        container.appendChild(recipeCard);
      });
    }
  </script>


</body>

<script src="../../header.js"></script>

</html>
