<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Login page">
    <meta name="keywords" content="HTML5, CSS3, JavaScript">
    <title>Login</title>
    <script src="../../loadTemplate.js"></script>
    <link rel="stylesheet" href="../../Templates/CSS/TextInput.css">
    <link rel="stylesheet" href="../../Templates/CSS/button.css">
    <link rel="stylesheet" href="../../Templates/CSS/footer.css">
    <link rel="stylesheet" href="../CSS/loginPage.css">
</head>
<body>
<div id="wrapper">
    <div class="login_container">
        <h2 id="login-title">Inicia sesión</h2>
        <form id="login-form">
            <div class="input-group">
                <label for="email">Correo:</label>
                <input type="email" id="email" name="email" class="text-input" placeholder="correo@gmail.com" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" class="text-input" placeholder="12345678" minlength="8" required>
            </div>

            <div class="button-group">
                <button type="submit" class="button">Iniciar Sesión</button>
                <button type="button" class="button" onclick="location.href='registerPage.html'">Crear cuenta</button>
            </div>
        </form>
    </div>

    <footer id="main_footer"></footer>
</div>

<script>
    document.addEventListener('DOMContentLoaded', init);


    function init() {

        loadTemplate('../../Templates/HTML/footer.html', 'main_footer');

    }
</script>

<script>
    document.getElementById("login-form").addEventListener("submit", async function(event) {
        event.preventDefault(); // Evita el envío automático

        const correo = document.getElementById("email").value;
        const contraseña = document.getElementById("password").value;

        try {
            // Obtener usuarios desde JSON Server
            let response = await fetch("http://localhost:3000/usuarios");
            let usuarios = await response.json();

            // Buscar usuario válido
            const usuarioValido = usuarios.find(user => user.correo === correo && user.contraseña === contraseña);

            if (usuarioValido) {
                alert(`Bienvenido, ${usuarioValido.nombre}!`);

                // Guardar sesión en localStorage
                localStorage.setItem("usuarioActual", JSON.stringify(usuarioValido));

                window.location.href = "/NewFoods/index.html"; // Redirigir a la página principal
            } else {
                alert("Correo o contraseña incorrectos.");
            }

        } catch (error) {
            console.error("Error al iniciar sesión:", error);
            alert("No se pudo conectar con el servidor.");
        }
    });
</script>


</body>
</html>
