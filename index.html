
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Main page">
  <meta name="keywords" content="HTML5, CSS3, JavaScript">

  <title>Main page</title>

  <script src="loadTemplate.js"></script>
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="Templates/CSS/header.css">
  <link rel="stylesheet" href="Templates/CSS/footer.css">
  <link rel="stylesheet" href="Templates/CSS/button.css">
  <link rel="stylesheet" href="Templates/CSS/ImageTitleTextHorizontal.css">


</head>
<body>
<div id="wrapper">
  <header id="main_header"></header>

  <main>
    <div class="button-container">
        <div id="button1"></div>
        <div id="button2"></div>
        <div id="button3"></div>
    </div>

    <div class="image-container">
      <div id="image-text"></div>
    </div>
  </main>

  <footer id="footer"></footer>
</div>
</body>

<script>
  document.addEventListener('DOMContentLoaded', init);

  function init() {
    loadTemplate('Templates/HTML/header.html', 'main_header');

    loadTemplate('Templates/HTML/button.html', 'button1');
    loadTemplate('Templates/HTML/button.html', 'button2');
    loadTemplate('Templates/HTML/button.html', 'button3');

    loadTemplate('Templates/HTML/ImageTitleTextHorizontal.html', 'image-text', () => fetchAndDisplayRecipes());
    loadTemplate('Templates/HTML/footer.html', 'footer');

    setTimeout(() => {
      document.getElementById('button1').querySelector('.button').textContent = "Recientes";
      document.getElementById('button2').querySelector('.button').textContent = "Populares";
      document.getElementById('button3').querySelector('.button').textContent = "Más guardadas";

      document.getElementById('button1').addEventListener("click", () => fetchAndDisplayRecipes("recent"));
      document.getElementById('button2').addEventListener("click", () => fetchAndDisplayRecipes("popular"));
      document.getElementById('button3').addEventListener("click", () => fetchAndDisplayRecipes("saved"));
    }, 200);
  }

  function fetchAndDisplayRecipes(orderBy = "recent") {
    fetch('http://localhost:3000/recipes')
            .then(response => response.json())
            .then(data => {
              let recipes = data;

              // Ordenar según el botón presionado
              if (orderBy === "popular") {
                recipes.sort((a, b) => b.likes - a.likes);
              } else if (orderBy === "saved") {
                recipes.sort((a, b) => b.saved - a.saved);
              } else {
                recipes.sort((a, b) => b.id - a.id);
              }

              const container = document.querySelector('.image-container');
              container.innerHTML = ''; // Limpiar contenido previo

              recipes.forEach(recipe => {
                fetch('Templates/HTML/ImageTitleTextHorizontal.html')
                        .then(response => response.text())
                        .then(template => {
                          const tempDiv = document.createElement('div');
                          tempDiv.innerHTML = template.trim();

                          document.querySelectorAll(".icon-save, .icon-like").forEach(button => {
                            button.addEventListener("click", event => {
                              event.preventDefault(); // Evita que el enlace se active
                              event.stopPropagation(); // Detiene la propagación del evento

                            });
                          });

                          const cardLink = tempDiv.querySelector('.card-link');
                          cardLink.href = `/NewFoods/Pages/HTML/recipePage.html?id=${recipe.id}`;
                          cardLink.querySelector('img').src = recipe.image;
                          cardLink.querySelector('img').alt = recipe.title;
                          cardLink.querySelector('h3').textContent = recipe.title;
                          cardLink.querySelector('.subtitle').textContent = recipe.subtitle;
                          cardLink.querySelector('.text').textContent = recipe.description;
                          cardLink.querySelector('.difficulty').textContent = recipe.difficulty;
                          cardLink.querySelector('.duration').textContent = recipe.duration;

                          // Actualizar valores de likes y saved
                          const likeButton = tempDiv.querySelector('.icon-like');
                          const saveButton = tempDiv.querySelector('.icon-save');

                          likeButton.querySelector('.like-count').textContent = recipe.likes;
                          saveButton.querySelector('.save-count').textContent = recipe.saved;

                          // Eventos para actualizar JSON Server
                          likeButton.addEventListener("click", () => updateRecipeStat(recipe.id, "likes", likeButton.querySelector('.like-count')));
                          saveButton.addEventListener("click", () => updateRecipeStat(recipe.id, "saved", saveButton.querySelector('.save-count')));

                          container.appendChild(cardLink);
                        });
              });
            })
            .catch(error => console.error('Error cargando recetas:', error));
  }

  function updateRecipeStat(recipeId, field, countElement) {
    fetch(`http://localhost:3000/recipes/${recipeId}`)
            .then(response => response.json())
            .then(recipe => {
              const updatedValue = recipe[field] + 1;

              return fetch(`http://localhost:3000/recipes/${recipeId}`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ [field]: updatedValue })
              });
            })
            .then(response => response.json())
            .then(updatedRecipe => {
              countElement.textContent = updatedRecipe[field];
            })
            .catch(error => console.error("Error actualizando la receta:", error));
  }
</script>


<script>
    //Redirigir en caso de que no haya un usuario logueado
    const usuarioGuardado = localStorage.getItem("usuarioActual");


    const usuarioActual = usuarioGuardado ? JSON.parse(usuarioGuardado) : null;

    if (!usuarioActual) {
        window.location.href = "Pages/HTML/loginPage.html";
    }
</script>

<script src="header.js"></script>

</html>
